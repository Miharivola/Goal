<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Predictor AI V56</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1c1c1e;
            --pitch-green: #c5e1a5;
            --btn-green: #2ecc71;
            --mine-red: #e74c3c;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 10px;
            margin: 0;
        }

        .app-container {
            background: var(--card);
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            padding: 15px;
            border: 1px solid #333;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 12px;
        }

        .input-group {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #444;
        }

        input {
            background: transparent;
            border: none;
            color: var(--btn-green);
            width: 100%;
            font-family: monospace;
            outline: none;
            font-size: 0.9rem;
        }

        .pitch {
            background: #222;
            padding: 6px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
        }

        .cell {
            aspect-ratio: 1;
            background: var(--pitch-green);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        /* Styling ny Ballon */
        .cell.ball {
            background: #fff;
            box-shadow: 0 0 10px var(--btn-green);
            transform: scale(1.05);
            z-index: 2;
        }

        /* Styling ny Mine */
        .cell.mine {
            background: #333;
            box-shadow: 0 0 8px var(--mine-red);
            opacity: 0.8;
        }

        .btn-predict {
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            color: black;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.7rem;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="status-header">
        <span id="liveTime">26/03/2026 | 21:35</span>
        <span style="color: var(--btn-green)">● GOAL AI V56</span>
    </div>

    <div class="input-group">
        <input type="text" id="clientSeed" placeholder="Apetaho ny Client Seed..." value="ty3GdzNIYM5XXytRaxu6">
    </div>

    <div class="pitch">
        <div class="grid" id="grid"></div>
    </div>

    <button class="btn-predict" onclick="runPredictor()">⚡ Analyser Terrain (10x5)</button>

    <div class="legend">
        <span>⚽ = Sûre</span>
        <span>💣 = Danger (Mine)</span>
    </div>
</div>

<script>
    const rows = 5;
    const cols = 10;
    const gridDiv = document.getElementById('grid');

    function createGrid() {
        gridDiv.innerHTML = '';
        for (let i = 0; i < rows * cols; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            gridDiv.appendChild(cell);
        }
    }

    function runPredictor() {
        const seed = document.getElementById('clientSeed').value;
        if (!seed) { alert("Seed azafady!"); return; }

        const cells = document.querySelectorAll('.cell');
        cells.forEach(c => {
            c.classList.remove('ball', 'mine');
            c.innerText = '';
        });

        // Loop isaky ny colonne 10
        for (let c = 0; c < cols; c++) {
            setTimeout(() => {
                let hash = 0;
                for (let i = 0; i < seed.length; i++) {
                    hash = seed.charCodeAt(i) + ((hash << 5) - hash);
                }
                
                // 1. Kajy ny toerana hisy ny Baolina (Safe)
                let ballRow = Math.abs(hash + (c * 17)) % rows;
                let ballIndex = (ballRow * cols) + c;
                
                // 2. Kajy ny toerana hisy ny Mine (Danger) - tsy maintsy hafa noho ny baolina
                let mineRow = Math.abs(hash + (c * 31) + 7) % rows;
                if (mineRow === ballRow) mineRow = (ballRow + 1) % rows;
                let mineIndex = (mineRow * cols) + c;
                
                // Asehoy ny Baolina
                cells[ballIndex].classList.add('ball');
                cells[ballIndex].innerText = '⚽';

                // Asehoy ny Mine
                cells[mineIndex].classList.add('mine');
                cells[mineIndex].innerText = '💣';
            }, c * 100);
        }
    }

    function updateTime() {
        const now = new Date();
        document.getElementById('liveTime').innerText = now.toLocaleString('fr-FR');
    }

    setInterval(updateTime, 1000);
    createGrid();
    updateTime();
</script>

</body>
</html>
