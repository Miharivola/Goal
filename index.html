<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Predictor 10x5</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1c1c1e;
            --pitch-green: #c5e1a5;
            --btn-green: #2ecc71;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 10px;
            margin: 0;
        }

        .app-container {
            background: var(--card);
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            padding: 15px;
            border: 1px solid #333;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 15px;
        }

        /* Seed Input Area */
        .input-group {
            background: #000;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #444;
        }

        input {
            background: transparent;
            border: none;
            color: var(--btn-green);
            width: 100%;
            font-family: monospace;
            outline: none;
            font-size: 0.9rem;
        }

        /* Terrain Grid (10 Columns x 5 Rows) */
        .pitch {
            background: #222;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr); /* 10 columns */
            gap: 4px;
        }

        .cell {
            aspect-ratio: 1;
            background: var(--pitch-green);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: 0.2s;
        }

        /* Ballon Style */
        .cell.ball {
            background: #fff;
            box-shadow: 0 0 12px var(--btn-green);
            transform: scale(1.05);
        }

        .btn-predict {
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            color: black;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-predict:active { transform: scale(0.97); }

        .footer {
            text-align: center;
            font-size: 0.6rem;
            color: #555;
            margin-top: 15px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="status-header">
        <span id="liveTime">26/03/2026 | 21:05</span>
        <span style="color: var(--btn-green)">● GOAL BFS V55</span>
    </div>

    <div class="input-group">
        <input type="text" id="clientSeed" placeholder="Ampidiro eto ny Client Seed..." value="ty3GdzNIYM5XXytRaxu6">
    </div>

    <div class="pitch">
        <div class="grid" id="grid"></div>
    </div>

    <button class="btn-predict" onclick="runPredictor()">⚡ Lancer Prediction (10x5)</button>

    <div class="footer">
        DETERMINISTIC ALGORITHM | EDIT WITH ❤ LOVABLE
    </div>
</div>

<script>
    const rows = 5; // Natao 5 izao
    const cols = 10;
    const gridDiv = document.getElementById('grid');

    function createGrid() {
        gridDiv.innerHTML = '';
        for (let i = 0; i < rows * cols; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            gridDiv.appendChild(cell);
        }
    }

    function runPredictor() {
        const seed = document.getElementById('clientSeed').value;
        if (!seed) { alert("Seed azafady!"); return; }

        const cells = document.querySelectorAll('.cell');
        cells.forEach(c => {
            c.classList.remove('ball');
            c.innerText = '';
        });

        // Lojika ho an'ny columns 10
        for (let c = 0; c < cols; c++) {
            setTimeout(() => {
                // Algoritma miankina amin'ny Seed
                let hash = 0;
                for (let i = 0; i < seed.length; i++) {
                    hash = seed.charCodeAt(i) + ((hash << 5) - hash);
                }
                
                // Mifidy tsara ny toerana (Row 0 ka hatramin'ny 4)
                let targetRow = Math.abs(hash + (c * 13)) % rows;
                let index = (targetRow * cols) + c;
                
                if (cells[index]) {
                    cells[index].classList.add('ball');
                    cells[index].innerText = '⚽';
                }
            }, c * 100);
        }
    }

    // Update Time
    function updateTime() {
        const now = new Date();
        document.getElementById('liveTime').innerText = now.toLocaleString('fr-FR');
    }

    setInterval(updateTime, 1000);
    createGrid();
    updateTime();
</script>

</body>
</html>
