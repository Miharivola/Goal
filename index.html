<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal AI V58 - Dual Seed</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --card: #161618;
            --green: #2ecc71;
            --pitch: #c5e1a5;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            padding: 10px;
            margin: 0;
        }

        .container {
            background: var(--card);
            width: 100%;
            max-width: 480px;
            border-radius: 15px;
            padding: 15px;
            border: 1px solid #222;
        }

        .header {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #555;
            margin-bottom: 15px;
        }

        /* Inputs */
        .input-box {
            margin-bottom: 10px;
        }

        label {
            font-size: 0.65rem;
            color: #888;
            display: block;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid #333;
            color: var(--green);
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8rem;
            box-sizing: border-box;
            outline: none;
        }

        /* Grid section */
        .percentage-row {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            margin: 15px 0 5px 0;
        }

        .percent-tag {
            font-size: 0.55rem;
            text-align: center;
            color: var(--green);
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            background: #111;
            padding: 5px;
            border-radius: 5px;
        }

        .cell {
            aspect-ratio: 1;
            background: var(--pitch);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .cell.ball { background: #fff; box-shadow: 0 0 8px var(--green); }
        .cell.mine { background: #333; opacity: 0.6; }

        .btn-predict {
            width: 100%;
            padding: 16px;
            background: var(--green);
            color: black;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .footer {
            margin-top: 15px;
            text-align: center;
            font-size: 0.6rem;
            color: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span id="date">27/03/2026</span>
        <span style="color: var(--green)">● DUAL SEED MODE V58</span>
    </div>

    <div class="input-box">
        <label>Prochain seed du client :</label>
        <input type="text" id="clientSeed" placeholder="Apetaho ny Client Seed..." value="YqVeiXuCoAxJcEphEJ...">
    </div>

    <div class="input-box">
        <label>Prochain seed du serveur (SHA256) :</label>
        <input type="text" id="serverSeed" placeholder="Apetaho ny Server Seed...">
    </div>

    <div class="percentage-row" id="percentRow"></div>
    <div class="grid" id="grid"></div>

    <button class="btn-predict" onclick="analyze()">⚡ Analyser avec Dual-Seed</button>

    <div class="footer">
        PROVABLY FAIR AI | SYNCED WITH SERVER DATA
    </div>
</div>

<script>
    const rows = 5, cols = 10;
    const grid = document.getElementById('grid');
    const pRow = document.getElementById('percentRow');

    function init() {
        grid.innerHTML = '';
        pRow.innerHTML = '';
        for (let i = 0; i < rows * cols; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            grid.appendChild(cell);
        }
        for (let i = 0; i < cols; i++) {
            const tag = document.createElement('div');
            tag.className = 'percent-tag';
            tag.innerText = '--%';
            pRow.appendChild(tag);
        }
    }

    function analyze() {
        const cSeed = document.getElementById('clientSeed').value;
        const sSeed = document.getElementById('serverSeed').value;
        
        if (!cSeed || !sSeed) {
            alert("Ampidiro ny Client Seed ARY ny Server Seed!");
            return;
        }

        const cells = document.querySelectorAll('.cell');
        const tags = document.querySelectorAll('.percent-tag');
        
        cells.forEach(c => { c.classList.remove('ball', 'mine'); c.innerText = ''; });

        // Mitambatra ny hery (Combined Hash)
        const combinedSeed = cSeed + sSeed;

        for (let c = 0; c < cols; c++) {
            setTimeout(() => {
                let hash = 0;
                for (let i = 0; i < combinedSeed.length; i++) {
                    hash = combinedSeed.charCodeAt(i) + ((hash << 5) - hash);
                }

                // Accuracy isan-jato
                let accuracy = 95 + (Math.abs(hash + c) % 5);
                tags[c].innerText = accuracy + '%';

                // Position calculation
                let ballRow = Math.abs(hash + (c * 19)) % rows;
                let mineRow = (ballRow + 2) % rows; // Elanelana kely

                cells[(ballRow * cols) + c].classList.add('ball');
                cells[(ballRow * cols) + c].innerText = '⚽';
                
                cells[(mineRow * cols) + c].classList.add('mine');
                cells[(mineRow * cols) + c].innerText = '💣';
            }, c * 80);
        }
    }

    init();
</script>

</body>
</html>
