<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictor Goal V53</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1c1c1e;
            --gold: #f39c12;
            --gray: #2c2c2e;
            --border: #333;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .app-window {
            background: var(--card);
            width: 100%;
            max-width: 360px;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid var(--border);
        }

        /* Top Status */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 15px;
        }

        /* Seed Input - Azo ovaina eto */
        .seed-section {
            background: #111;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #222;
        }

        .seed-label {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        .seed-input {
            background: transparent;
            border: none;
            color: var(--gold);
            width: 100%;
            font-family: monospace;
            font-size: 0.9rem;
            outline: none;
        }

        /* Grid 7 Columns x 4 Rows */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            background: #000;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .cell {
            aspect-ratio: 1;
            background: #262626;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .cell.active {
            background: var(--gold);
            box-shadow: 0 0 15px var(--gold);
            color: black;
            font-weight: bold;
            transform: scale(1.05);
        }

        /* Main Button */
        .btn-main {
            background: linear-gradient(180deg, #f39c12 0%, #d35400 100%);
            color: black;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
        }

        .btn-main:active { transform: scale(0.97); }

        .footer {
            text-align: center;
            font-size: 0.65rem;
            color: #444;
            margin-top: 15px;
        }
        .footer span { color: #e74c3c; }
    </style>
</head>
<body>

<div class="app-window">
    <div class="status-bar">
        <span id="liveClock">26/03/2026 | 18:38</span>
        <span style="color: var(--gold)">🏆 Moyen</span>
    </div>

    <div class="seed-section">
        <label class="seed-label">Seed du Client (Editable)</label>
        <input type="text" id="clientSeed" class="seed-input" value="ty3GdzNIYM5XXytRaxu6" placeholder="Apetaho eto ny seed...">
    </div>

    <div class="grid-container" id="grid">
        </div>

    <button class="btn-main" onclick="startBFS()">
        ⚡ Lancer BFS Déterministe
    </button>

    <div class="footer">
        Edit with <span>❤</span> Lovable
    </div>
</div>

<script>
    const grid = document.getElementById('grid');
    const rows = 4;
    const cols = 7;

    // 1. Mamorona Grid
    function init() {
        grid.innerHTML = '';
        for (let i = 0; i < rows * cols; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            grid.appendChild(cell);
        }
    }

    // 2. Lojika BFS miankina amin'ny Seed
    function startBFS() {
        const seedValue = document.getElementById('clientSeed').value;
        if (!seedValue) {
            alert("Ampidiro ny Seed!");
            return;
        }

        const cells = document.querySelectorAll('.cell');
        cells.forEach(c => {
            c.classList.remove('active');
            c.innerText = '';
        });

        // "Deterministic Path" - Miankina amin'ny seed ny toerana hisy kintana
        for (let c = 0; c < cols; c++) {
            setTimeout(() => {
                // Kajy kely mampiasa ny litera ao amin'ny seed
                let charCode = seedValue.charCodeAt(c % seedValue.length) || 0;
                let targetRow = (charCode + c) % rows;
                let index = (targetRow * cols) + c;
                
                cells[index].classList.add('active');
                cells[index].innerText = '⭐';
            }, c * 200); // Animation isaky ny tsanganana
        }
    }

    // Ora 24h
    function updateClock() {
        const now = new Date();
        const d = now.toLocaleDateString('fr-FR');
        const t = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        document.getElementById('liveClock').innerText = `${d} | ${t}`;
    }

    setInterval(updateClock, 1000);
    init();
    updateClock();
</script>

</body>
</html>
