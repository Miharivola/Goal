<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Predictor Pro</title>
    <style>
        body {
            background-color: #0b1a0b; /* Maitso antitra toy ny lalao */
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .app-card {
            background: #1a1a1a;
            border: 2px solid #2ecc71;
            border-radius: 15px;
            padding: 20px;
            width: 320px;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
        }

        .header {
            text-align: center;
            font-weight: bold;
            color: #2ecc71;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        /* Ny Grid Goal: 7 columns x 4 rows */
        .goal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            background: #0f2b0f;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .cell {
            aspect-ratio: 1/1.2;
            background: #2d5a2d;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: 0.3s;
        }

        /* Rehefa misy kintana (prediction) */
        .cell.win {
            background: #f1c40f; /* Loko volamena */
            box-shadow: inset 0 0 10px #000;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #000;
            color: #2ecc71;
            font-family: monospace;
        }

        .btn {
            background: #2ecc71;
            color: black;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn:active { transform: scale(0.98); }

        .footer-info {
            margin-top: 15px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            color: #888;
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">GOAL PREDICTOR AI</div>

    <div class="controls">
        <input type="text" id="seedInput" placeholder="Ampidiro ny Client Seed...">
        <div class="goal-grid" id="grid"></div>
        <button class="btn" onclick="predictPath()">Hitaiza ny lalana (Predict)</button>
    </div>

    <div class="footer-info">
        <span>Mode: BFS Determinist</span>
        <span id="time">17:50</span>
    </div>
</div>

<script>
    const rows = 4;
    const cols = 7;
    const gridElement = document.getElementById('grid');

    // Mamorona ny Grid 4x7
    function createGrid() {
        gridElement.innerHTML = '';
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${r}-${c}`;
                gridElement.appendChild(cell);
            }
        }
    }

    function predictPath() {
        const seed = document.getElementById('seedInput').value;
        if(!seed) { alert("Ampidiro ny Seed!"); return; }

        // Diovina ny grid
        document.querySelectorAll('.cell').forEach(c => {
            c.classList.remove('win');
            c.innerText = '';
        });

        // Lojika faminaniana isaky ny colonne (1 kintana isaky ny colonne)
        for (let c = 0; c < cols; c++) {
            // Mampiasa ny seed mba hifidianana laharana (row) 0 hatramin'ny 3
            let charCode = seed.charCodeAt(c % seed.length) || 5;
            let targetRow = (charCode + c) % rows;
            
            const targetCell = document.getElementById(`cell-${targetRow}-${c}`);
            targetCell.classList.add('win');
            targetCell.innerText = '⭐';
        }
    }

    // Famantaranandro 24h
    function updateClock() {
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ":" + 
                        now.getMinutes().toString().padStart(2, '0');
        document.getElementById('time').innerText = timeStr;
    }

    setInterval(updateClock, 1000);
    createGrid();
    updateClock();
</script>

</body>
</html>
