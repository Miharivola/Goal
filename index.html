<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictor Goal BFS</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1c1c1e;
            --gold: #f39c12;
            --gray: #2c2c2e;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .app-window {
            background: var(--card);
            width: 100%;
            max-width: 360px;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }

        /* Top Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 15px;
        }

        /* Grid 4x7 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            background: #000;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .cell {
            aspect-ratio: 1;
            background: #262626;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .cell.active {
            background: var(--gold);
            box-shadow: 0 0 10px var(--gold);
            color: black;
            font-weight: bold;
        }

        /* Button "Lancer BFS" */
        .btn-main {
            background: linear-gradient(to bottom, #f39c12, #d35400);
            color: black;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        /* Clavier/Input section */
        .input-box {
            background: #111;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }

        .seed-display {
            color: var(--gold);
            word-break: break-all;
            font-family: monospace;
            display: block;
            margin-top: 5px;
        }

        .footer-logo {
            text-align: center;
            font-size: 0.7rem;
            color: #555;
        }
        
        .footer-logo span { color: #ff4d4d; }
    </style>
</head>
<body>

<div class="app-window">
    <div class="status-bar">
        <span>26/03/2026 | 18:20</span>
        <span style="color: var(--gold)">● Moyen</span>
    </div>

    <div class="input-box">
        <label>Client Seed actif :</label>
        <span id="displaySeed" class="seed-display">ty3GdzNIYM5XXytRaxu6...</span>
    </div>

    <div class="grid-container" id="grid"></div>

    <button class="btn-main" onclick="runBFS()">
        ⚡ Lancer BFS Déterministe
    </button>

    <div class="footer-logo">
        Edit with <span>❤</span> Lovable
    </div>
</div>

<script>
    const grid = document.getElementById('grid');
    const rows = 4;
    const cols = 7;

    // 1. Create Grid
    function init() {
        grid.innerHTML = '';
        for (let i = 0; i < rows * cols; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            grid.appendChild(cell);
        }
    }

    // 2. BFS Simulation Logic
    function runBFS() {
        const cells = document.querySelectorAll('.cell');
        cells.forEach(c => {
            c.classList.remove('active');
            c.innerText = '';
        });

        // Mifidy lalana 1 isaky ny colonne (7 columns)
        for (let c = 0; c < cols; c++) {
            setTimeout(() => {
                let randomRow = Math.floor(Math.random() * rows);
                let index = (randomRow * cols) + c;
                cells[index].classList.add('active');
                cells[index].innerText = '⭐';
                
                // Audio effect kely raha tianao (optional)
                // new Audio('click.mp3').play();
            }, c * 150); // Misy "animation" kely mandeha isaky ny tsanganana
        }
    }

    init();
</script>

</body>
</html>
