<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal AI V60 - Stable</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --card: #161618;
            --green: #2ecc71;
            --pitch: #c5e1a5;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 10px;
            margin: 0;
        }

        .container {
            background: var(--card);
            width: 100%;
            max-width: 480px;
            border-radius: 15px;
            padding: 15px;
            border: 1px solid #333;
        }

        .header {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 15px;
        }

        .input-box { margin-bottom: 10px; }
        label { font-size: 0.65rem; color: #666; display: block; margin-bottom: 4px; }

        input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #444;
            color: var(--green);
            border-radius: 8px;
            font-family: monospace;
            outline: none;
            box-sizing: border-box;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            margin-top: 15px;
        }

        .cell {
            aspect-ratio: 1;
            background: var(--pitch);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .cell.ball { background: #fff; box-shadow: 0 0 10px var(--green); }
        .cell.mine { background: #333; opacity: 0.7; }

        .btn-predict {
            width: 100%;
            padding: 18px;
            background: var(--green);
            color: black;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
        }
        
        #status {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 10px;
            color: var(--green);
            height: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>27/03/2026</span>
        <span style="color: var(--green)">● STABLE ENGINE V60</span>
    </div>

    <div class="input-box">
        <label>CLIENT SEED :</label>
        <input type="text" id="cSeed" placeholder="Apetaho eto..." value="zVEQP74Jbv6hot8m0g8h">
    </div>

    <div class="input-box">
        <label>SERVER SEED (Optionnel) :</label>
        <input type="text" id="sSeed" placeholder="Apetaho eto raha misy...">
    </div>

    <div id="status"></div>

    <div class="grid" id="grid"></div>

    <button class="btn-predict" onclick="startAnalysis()">⚡ ANALYSER LE TERRAIN</button>
</div>

<script>
    const rows = 5, cols = 10;
    const grid = document.getElementById('grid');

    function init() {
        grid.innerHTML = '';
        for (let i = 0; i < rows * cols; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            grid.appendChild(cell);
        }
    }

    function startAnalysis() {
        const cs = document.getElementById('cSeed').value.trim();
        const ss = document.getElementById('sSeed').value.trim();
        const status = document.getElementById('status');

        if (!cs && !ss) {
            alert("Ampidiro farafahakeliny ny seed iray!");
            return;
        }

        status.innerText = "Calcul de l'algorithme en cours...";
        const cells = document.querySelectorAll('.cell');
        cells.forEach(c => { c.classList.remove('ball', 'mine'); c.innerText = ''; });

        const finalSeed = cs + ss + "V60_SALT";
        let hash = 0;
        for (let i = 0; i < finalSeed.length; i++) {
            hash = ((hash << 5) - hash) + finalSeed.charCodeAt(i);
            hash |= 0;
        }

        for (let c = 0; c < cols; c++) {
            setTimeout(() => {
                let colHash = Math.abs(hash ^ (c * 1234567));
                let ballRow = colHash % rows;
                let mineRow = (colHash + 1) % rows;

                let bIdx = (ballRow * cols) + c;
                let mIdx = (mineRow * cols) + c;

                cells[bIdx].classList.add('ball');
                cells[bIdx].innerText = '⚽';
                cells[mIdx].classList.add('mine');
                cells[mIdx].innerText = '💣';

                if (c === cols - 1) status.innerText = "Analyse terminée !";
            }, c * 80);
        }
    }

    init();
</script>

</body>
</html>
