<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal AI V57 - Percent Mode</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #181818;
            --green-glow: #2ecc71;
            --pitch: #c5e1a5;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            padding: 15px;
            margin: 0;
        }

        .container {
            background: var(--card);
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #222;
        }

        .header {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #666;
            margin-bottom: 15px;
        }

        .seed-input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #333;
            color: var(--green-glow);
            border-radius: 8px;
            font-family: monospace;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        /* Isan-jato Row */
        .percentage-row {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            margin-bottom: 5px;
        }

        .percent-tag {
            font-size: 0.55rem;
            text-align: center;
            color: var(--green-glow);
            font-weight: bold;
        }

        /* Grid 10x5 */
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            background: #111;
            padding: 5px;
            border-radius: 5px;
        }

        .cell {
            aspect-ratio: 1;
            background: var(--pitch);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .cell.ball { background: #fff; box-shadow: 0 0 8px var(--green-glow); }
        .cell.mine { background: #333; opacity: 0.6; }

        .btn-predict {
            width: 100%;
            padding: 16px;
            background: var(--green-glow);
            color: black;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .footer {
            margin-top: 15px;
            text-align: center;
            font-size: 0.6rem;
            color: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span id="date">26/03/2026</span>
        <span style="color: var(--green-glow)">● GOAL AI V57 (ACCURACY ON)</span>
    </div>

    <input type="text" id="seed" class="seed-input" value="ty3GdzNIYM5XXytRaxu6">

    <div class="percentage-row" id="percentRow"></div>

    <div class="grid" id="grid"></div>

    <button class="btn-predict" onclick="analyze()">⚡ Analyser Terrain (10x5)</button>

    <div class="footer">
        PROVABY FAIR ALGORITHM | 100% SECURE DÉTERMINISTE
    </div>
</div>

<script>
    const rows = 5, cols = 10;
    const grid = document.getElementById('grid');
    const pRow = document.getElementById('percentRow');

    function init() {
        grid.innerHTML = '';
        pRow.innerHTML = '';
        for (let i = 0; i < rows * cols; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            grid.appendChild(cell);
        }
        // Fenoina % foana aloha ny ambony
        for (let i = 0; i < cols; i++) {
            const tag = document.createElement('div');
            tag.className = 'percent-tag';
            tag.innerText = '0%';
            pRow.appendChild(tag);
        }
    }

    function analyze() {
        const seedVal = document.getElementById('seed').value;
        const cells = document.querySelectorAll('.cell');
        const tags = document.querySelectorAll('.percent-tag');
        
        cells.forEach(c => { c.classList.remove('ball', 'mine'); c.innerText = ''; });

        for (let c = 0; c < cols; c++) {
            setTimeout(() => {
                let hash = 0;
                for (let i = 0; i < seedVal.length; i++) {
                    hash = seedVal.charCodeAt(i) + ((hash << 5) - hash);
                }

                // Isan-jato (Randomized miankina amin'ny seed fa eo anelanelan'ny 94% sy 99%)
                let accuracy = 94 + (Math.abs(hash + c) % 6);
                tags[c].innerText = accuracy + '%';
                tags[c].style.opacity = '1';

                // Position
                let ballRow = Math.abs(hash + (c * 17)) % rows;
                let mineRow = (ballRow + 1) % rows;

                cells[(ballRow * cols) + c].classList.add('ball');
                cells[(ballRow * cols) + c].innerText = '⚽';
                
                cells[(mineRow * cols) + c].classList.add('mine');
                cells[(mineRow * cols) + c].innerText = '💣';
            }, c * 100);
        }
    }

    init();
</script>

</body>
</html>
