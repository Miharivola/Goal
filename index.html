<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Predictor Real Clone</title>
    <style>
        :root {
            --bg-game: #0e1a0e;
            --pitch-green: #c5e1a5; /* Mitovy loko amin'ny sary */
            --gold: #f39c12;
            --dark-card: #1c1c1e;
        }

        body {
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 10px;
            margin: 0;
        }

        .app-container {
            background: var(--dark-card);
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
            padding: 15px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .header {
            text-align: center;
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        /* Seed Input */
        .seed-input-area {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #2ecc71;
        }

        input {
            background: transparent;
            border: none;
            color: #2ecc71;
            width: 100%;
            font-family: monospace;
            outline: none;
        }

        /* Ny Terrain Goal (10 columns x 4 rows) */
        .pitch {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 10px;
            position: relative;
            margin-bottom: 20px;
            border: 2px solid #444;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr); /* 10 columns araka ny sary */
            gap: 4px;
        }

        .cell {
            aspect-ratio: 1/1.2;
            background: var(--pitch-green);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: 0.3s;
        }

        /* Rehefa mipoitra ny lalana (Ballon) */
        .cell.ball {
            background: #fff;
            box-shadow: 0 0 15px #2ecc71;
            animation: bounce 0.4s ease-out;
        }

        @keyframes bounce {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }

        .btn-predict {
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-predict:active { transform: scale(0.98); }

        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: #555;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <span id="date">26/03/2026</span>
        <span style="color: #2ecc71;">● GOAL BFS PRO</span>
    </div>

    <div class="seed-input-area">
        <input type="text" id="seed" placeholder="Apetaho eto ny Client Seed...">
    </div>

    <div class="pitch">
        <div class="grid" id="grid"></div>
    </div>

    <button class="btn-predict" onclick="predictGoal()">Calculer le Chemin</button>

    <div class="footer">
        Algorithme Deterministic V54 | Edit with Lovable
    </div>
</div>

<script>
    const rows = 4;
    const cols = 10; // Natao 10 hitovy amin'ilay sary farany
    const gridDiv = document.getElementById('grid');

    function initGrid() {
        gridDiv.innerHTML = '';
        for (let i = 0; i < rows * cols; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            gridDiv.appendChild(cell);
        }
    }

    function predictGoal() {
        const seedVal = document.getElementById('seed').value;
        if (!seedVal) { alert("Ampidiro ny seed!"); return; }

        const cells = document.querySelectorAll('.cell');
        cells.forEach(c => {
            c.classList.remove('ball');
            c.innerText = '';
        });

        // Lojika fakana ny lalana (isaky ny colonne)
        for (let c = 0; c < cols; c++) {
            setTimeout(() => {
                let hash = 0;
                for (let i = 0; i < seedVal.length; i++) {
                    hash = seedVal.charCodeAt(i) + ((hash << 5) - hash);
                }
                
                // Mifidy row (0 hatramin'ny 3) miankina amin'ny seed sy colonne
                let targetRow = Math.abs(hash + c) % rows;
                let index = (targetRow * cols) + c;
                
                cells[index].classList.add('ball');
                cells[index].innerText = '⚽';
            }, c * 150);
        }
    }

    initGrid();
</script>

</body>
</html>
